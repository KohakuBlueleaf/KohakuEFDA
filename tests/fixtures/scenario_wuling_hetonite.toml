# Wuling benchmark for placement and routing: Hetonite from ores, water and acid in a
# level-3 Sky King Flats square (crucibles, a purifier, refiners, grinders, dumps, pumps).

mode = "area"
mixed_lanes = true
gas = false

[supply]
item_copper_ore = 120
item_iron_ore = "unlimited"
item_liquid_water = "unlimited"
item_liquid_acid = "unlimited"

[targets]
item_copper_enr = 6

[basement]
region = "wuling"
basement_id = "sky_king_flats"
level = 3
depot_level = 1

[recipe_overrides]
item_copper_enr = "pool_copper_enr_1"
